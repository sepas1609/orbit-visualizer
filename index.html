<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orbit Visualizer · Boddu Saran</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020010;overflow:hidden;font-family:'Courier New',monospace;cursor:none}
  canvas{display:block}
  #ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
  #ui h1{font-size:1rem;color:#7c3aed;letter-spacing:3px;text-shadow:0 0 20px #7c3aed}
  #ui p{font-size:.65rem;color:#555;margin-top:3px;letter-spacing:1px}
  #controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:10}
  button{background:rgba(124,58,237,.12);border:1px solid #7c3aed44;color:#a855f7;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.7rem;letter-spacing:1px;transition:all .3s;font-family:'Courier New',monospace}
  button:hover,button.active{background:rgba(124,58,237,.3);box-shadow:0 0 12px #7c3aed66}
  a{color:#00e5ff;text-decoration:none;font-size:.7rem;letter-spacing:2px;border:1px solid #00e5ff33;padding:5px 12px;border-radius:20px;background:rgba(0,229,255,.05)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>🔮 ORBIT VISUALIZER</h1>
  <p>Move mouse · shapes evolve with sound</p>
</div>
<div id="controls">
  <button id="muteBtn">🔇 Mute</button>
  <button onclick="randomize()">🎲 Randomize</button>
  <a href="https://github.com/sepas1609" target="_blank">sepas1609</a>
</div>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;
window.addEventListener('resize',()=>{W=c.width=innerWidth;H=c.height=innerHeight});

let mx=W/2,my=H/2,muted=false,audioCtx=null;
let frame=0,lastTone=0;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

function playTone(freq,dur=0.4,vol=0.06){
  if(muted||!audioCtx)return;
  const now=audioCtx.currentTime;
  if(now-lastTone<0.08)return;lastTone=now;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.type='sine';osc.frequency.setValueAtTime(freq,now);
  gain.gain.setValueAtTime(vol,now);
  gain.gain.exponentialRampToValueAtTime(0.001,now+dur);
  osc.start(now);osc.stop(now+dur);
}

const muteBtn=document.getElementById('muteBtn');
muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'🔊 Sound':'🔇 Mute';if(!muted)initAudio();};

document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
document.addEventListener('touchmove',e=>{e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:false});

// Orbital system
let orbits=[];
function randomize(){
  orbits=[];
  const n=5+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const baseRadius=60+i*55+Math.random()*30;
    const nodeCount=3+Math.floor(Math.random()*7);
    orbits.push({
      baseRadius,radius:baseRadius,
      speed:(Math.random()>.5?1:-1)*(0.003+Math.random()*0.015),
      angle:Math.random()*Math.PI*2,
      nodeCount,
      hue:Math.floor(Math.random()*360),
      width:1+Math.random()*2.5,
      pulseFreq:60+Math.random()*200,
      pulseAmp:5+Math.random()*15,
      nodes:[],
    });
    const o=orbits[i];
    for(let j=0;j<nodeCount;j++){
      o.nodes.push({
        angle:(j/nodeCount)*Math.PI*2,
        r:4+Math.random()*8,
        speed:(Math.random()-.5)*.02,
        trail:[],
      });
    }
  }
}
randomize();

// Custom cursor
let cursorTrail=[];
document.addEventListener('click',()=>{initAudio();const freq=200+Math.random()*600;playTone(freq,.5,.08);});

function draw(){
  frame++;
  ctx.fillStyle='rgba(2,0,16,0.18)';
  ctx.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  const normX=(mx-cx)/cx,normY=(my-cy)/cy;

  // Custom cursor
  cursorTrail.unshift({x:mx,y:my});
  if(cursorTrail.length>25)cursorTrail.pop();
  for(let i=1;i<cursorTrail.length;i++){
    const a=(1-i/cursorTrail.length)*.6;
    ctx.strokeStyle=`rgba(124,58,237,${a})`;
    ctx.lineWidth=2*(1-i/cursorTrail.length);
    ctx.beginPath();ctx.moveTo(cursorTrail[i-1].x,cursorTrail[i-1].y);ctx.lineTo(cursorTrail[i].x,cursorTrail[i].y);ctx.stroke();
  }
  ctx.fillStyle='rgba(124,58,237,0.9)';
  ctx.beginPath();ctx.arc(mx,my,3,0,Math.PI*2);ctx.fill();

  // Center glow
  const centerGrd=ctx.createRadialGradient(cx,cy,0,cx,cy,40);
  centerGrd.addColorStop(0,'rgba(124,58,237,0.4)');centerGrd.addColorStop(1,'rgba(124,58,237,0)');
  ctx.fillStyle=centerGrd;ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fill();

  // Draw orbits
  for(let oi=0;oi<orbits.length;oi++){
    const o=orbits[oi];
    // Mouse influences radius and speed
    o.radius=o.baseRadius+normX*20+Math.sin(frame*.01+oi)*o.pulseAmp;
    const effectiveSpeed=o.speed*(1+Math.abs(normY)*.5);
    o.angle+=effectiveSpeed;

    // Orbit ring
    ctx.strokeStyle=`hsla(${o.hue},80%,60%,0.15)`;
    ctx.lineWidth=o.width;
    ctx.beginPath();ctx.arc(cx,cy,o.radius,0,Math.PI*2);ctx.stroke();

    // Nodes on orbit
    for(const node of o.nodes){
      node.angle+=node.speed*(1+Math.abs(normX)*.3)+effectiveSpeed;
      const nx2=cx+Math.cos(o.angle+node.angle)*o.radius;
      const ny2=cy+Math.sin(o.angle+node.angle)*o.radius;

      node.trail.unshift({x:nx2,y:ny2});
      if(node.trail.length>40)node.trail.pop();

      // Node trail
      for(let i=1;i<node.trail.length;i++){
        const a=(1-i/node.trail.length)*0.5;
        ctx.strokeStyle=`hsla(${o.hue},100%,70%,${a})`;
        ctx.lineWidth=node.r*0.4*(1-i/node.trail.length);
        ctx.beginPath();ctx.moveTo(node.trail[i-1].x,node.trail[i-1].y);ctx.lineTo(node.trail[i].x,node.trail[i].y);ctx.stroke();
      }

      // Node glow
      const grd=ctx.createRadialGradient(nx2,ny2,0,nx2,ny2,node.r*2.5);
      grd.addColorStop(0,`hsla(${o.hue},100%,80%,0.5)`);
      grd.addColorStop(1,`hsla(${o.hue},100%,60%,0)`);
      ctx.fillStyle=grd;ctx.beginPath();ctx.arc(nx2,ny2,node.r*2.5,0,Math.PI*2);ctx.fill();

      // Node core
      ctx.fillStyle=`hsl(${o.hue},100%,75%)`;
      ctx.beginPath();ctx.arc(nx2,ny2,node.r,0,Math.PI*2);ctx.fill();

      // Connect lines to center
      ctx.strokeStyle=`hsla(${o.hue},80%,60%,0.08)`;
      ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx2,ny2);ctx.stroke();

      // Sound trigger
      if(frame%Math.ceil(o.pulseFreq)===oi&&!muted&&audioCtx){
        const dist=Math.hypot(nx2-mx,ny2-my);
        if(dist<o.radius*.8){
          playTone(220+oi*80+Math.floor(node.angle*50)%200,.3,.03);
        }
      }
    }
  }

  // FPS / info
  ctx.fillStyle='rgba(124,58,237,0.4)';
  ctx.font='10px Courier New';
  ctx.fillText(`${orbits.length} orbital rings · ${orbits.reduce((a,o)=>a+o.nodes.length,0)} nodes`,10,25);

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
